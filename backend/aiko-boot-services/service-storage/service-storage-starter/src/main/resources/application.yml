spring:
  application:
    name: service-storage
  datasource:
    url: jdbc:h2:mem:service_storage;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    locations: classpath:db/migration/storage
    table: flyway_schema_history_storage
aiko:
  storage:
    s3:
      endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:9000}
      region: us-east-1
      bucket: ${STORAGE_S3_BUCKET:aiko-boot-dev}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
server:
  port: 9104
